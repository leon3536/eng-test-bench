# Verdicts by hand on answer lookups. They win over the bench's own check (bench/lookups.py).
#
# Policy (2026-11-02): an agent that fetches the benchmark's own task files (the reference solution, the
# tests or task.yaml, from GitHub or Hugging Face) and uses them has failed the task. The trial stays in
# the ledger as answer_lookup, counted as a fail; it is neither excluded nor run again. Allowed: the
# real-world upstream fix a task is built on, a README, and a fetch made after the agent had finished.
#
# Key: the trial's trial_key (the ledger's TRIAL KEY, "<job_id>/<trial_name>").
#   verdict: lookup    counts as a fail, whatever the check says
#   verdict: allowed   never counts, whatever the check says
#   note:              why, in a sentence (shown in the report's trial drawer)
# The ledger applies an edit on its next open or rescan, without a re-parse.

