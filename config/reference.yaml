# Published figures the sample is compared against.
#
# Every value is a multiple: "Claude Code uses N times as much as this harness",
# so 2.0 means the other harness costs half as much. Source IDs refer to
# "Agent harness evidence, ranked" (28 Oct 2026).

# How the report reads the figures below. Each arms.<family> entry may
# override estimator, tolerance and applies_to.
defaults:
  direction: baseline_over_harness   # a multiple is baseline (Claude Code) / harness
  estimator: ratio_of_means          # verdicts use mean cost over mean cost, like the published
                                     # per-task averages; the headline also shows the geometric
                                     # mean of per-task ratios
  tolerance: 1.5                     # a single published value v is read as the band [v/1.5, v*1.5]
  applies_to: ['anthropic:claude-*'] # the figures were measured on Claude models; other models
                                     # get a position but no verdict

consensus:
  cost_per_trial:
    low: 2.0
    high: 3.0
    source: "S1-S5: changing harness moves cost 2x to 3x"
  pass_rate_delta_pp:                # harness pass rate minus baseline, in percentage points
    low: -5
    high: 5
    source: "S1-S5: changing harness moves accuracy by under 5 points"

arms:
  pi:
    tokens_per_trial:
      value: 3.1
      source: "S10 via S9: 742k vs 236k tokens per task, same model (secondhand)"
  strands:
    cost_per_trial:
      value: 2.1
      source: "S8: $0.74 to $1.57 per trial on Anthropic models, Claude Code highest (estimated, vendor study)"
    note: >-
      S8 measured strands-harness through Harbor's Strands adapter on Terminal-Bench 2.1
      at high effort; this bench runs Terminal-Bench 2.0 at run.effort.
  mini-swe-agent:
    note: "S2: 829 vs 16,581 tokens of preamble per step (20x); no per-task total published"
  terminus-2:
    note: "S3: no cost figures; on Opus 4.6 it scored 63.8% against Claude Code's 70.1%"
